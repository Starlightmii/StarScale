<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="spinning CD-ROM with holo reflections">
  <defs>
    <linearGradient id="cdsheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9ecf" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#7de8e0" stop-opacity=".8"/>
      <stop offset="1" stop-color="#9ad34f" stop-opacity=".8"/>
    </linearGradient>
    <radialGradient id="cdrings" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0a0a2e"/><stop offset=".35" stop-color="#e8e8f2"/><stop offset="1" stop-color="#c9c9dd"/>
    </radialGradient>
  </defs>
  <rect width="880" height="150" fill="#0a0a2e"/>
  <text x="440" y="30" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="15" letter-spacing="4" fill="#b8b8d8">✦ RUNS FROM A CD-ROM, PROBABLY ✦</text>

  <!-- CD 1: full spin + rainbow sheen -->
  <g transform="translate(150,85)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.8s" repeatCount="indefinite"/>
      <circle r="38" fill="#e8e8f2"/>
      <path d="M0 -38 A38 38 0 0 1 38 0 L0 0 Z" fill="#ff9ecf" opacity=".6"/>
      <path d="M0 38 A38 38 0 0 1 -38 0 L0 0 Z" fill="#7de8e0" opacity=".65"/>
      <path d="M0 -38 A38 38 0 0 0 -38 0 L0 0 Z" fill="#9ad34f" opacity=".4"/>
      <path d="M0 38 A38 38 0 0 0 38 0 L0 0 Z" fill="url(#cdsheen)" opacity=".5"/>
      <circle r="10" fill="#0a0a2e"/><circle r="4" fill="#e8e8f2"/>
    </g>
  </g>
  <text x="210" y="90" font-family="'Courier New',monospace" font-size="12" fill="#6f695b">model weights</text>

  <!-- CD 2: slow spin, mirror side -->
  <g transform="translate(440,85)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
      <circle r="38" fill="#f2f2fa"/>
      <path d="M0 -38 A38 38 0 0 1 38 0 L0 0 Z" fill="#7de8e0" opacity=".6"/>
      <path d="M0 38 A38 38 0 0 1 -38 0 L0 0 Z" fill="#ff9ecf" opacity=".55"/>
      <circle r="10" fill="#0a0a2e"/><circle r="4" fill="#e8e8f2"/>
      <rect x="-2" y="-38" width="4" height="10" fill="#9ad34f" opacity=".8"/>
    </g>
  </g>
  <text x="500" y="90" font-family="'Courier New',monospace" font-size="13" fill="#6f695b">no. 1 hit: "crispify"</text>

  <!-- CD 3: spin + wobble shine -->
  <g transform="translate(730,85)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.5s" repeatCount="indefinite"/>
      <circle r="38" fill="#e8e8f2"/>
      <path d="M0 -38 A38 38 0 0 1 38 0 L0 0 Z" fill="#ff9ecf" opacity=".6"/>
      <path d="M0 38 A38 38 0 0 1 -38 0 L0 0 Z" fill="#7de8e0" opacity=".6"/>
      <circle r="9" fill="#0a0a2e"/><circle r="3.5" fill="#e8e8f2"/>
    </g>
    <circle r="38" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="1">
      <animate attributeName="r" values="38;34;38" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="496" y="90" font-family="'Courier New',monospace" font-size="12" fill="#6f695b">volume 4× better</text>
</svg>
