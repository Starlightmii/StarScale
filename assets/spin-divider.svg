<svg xmlns="http://www.w3.org/2000/svg" width="880" height="64" viewBox="0 0 880 64" role="img" aria-label="spinning star divider">
  <rect width="880" height="64" fill="#0a0a2e"/>
  <!-- lines out -->
  <line x1="40" y1="32" x2="380" y2="32" stroke="#3a3a6a" stroke-width="1.5"/>
  <line x1="500" y1="32" x2="840" y2="32" stroke="#3a3a6a" stroke-width="1.5"/>
  <line x1="380" y1="32" x2="500" y2="32" stroke="url(#g)" stroke-width="1.5"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9ecf"><animate attributeName="stop-color" values="#ff9ecf;#7de8e0;#9ad34f;#ff9ecf" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#7de8e0"><animate attributeName="stop-color" values="#7de8e0;#9ad34f;#ff9ecf;#7de8e0" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>
  <!-- orbiting satellites -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 440 32" to="360 440 32" dur="9s" repeatCount="indefinite"/>
    <circle cx="412" cy="32" r="2.5" fill="#ff9ecf"/>
    <circle cx="468" cy="32" r="2" fill="#7de8e0"/>
  </g>
  <!-- central 4-point star, spinning + scale pulse -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 440 32" to="360 440 32" dur="6s" repeatCount="indefinite"/>
    <path d="M440 8 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6 z" fill="#ffd166" stroke="#b8860b" stroke-width="1">
      <animateTransform attributeName="transform" type="scale" values="1;.86;1" dur="1.6s" additive="sum" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- inner counter-spin glow ring -->
  <circle cx="440" cy="32" r="26" fill="none" stroke="#ff9ecf" stroke-opacity=".3" stroke-width="1" stroke-dasharray="4 6">
    <animateTransform attributeName="transform" type="rotate" from="360 440 32" to="0 440 32" dur="12s" repeatCount="indefinite"/>
  </circle>
  <!-- endpoint stars -->
  <path d="M40 27 l2.5 5 5 2.5 -5 2.5 -2.5 5 -2.5 -5 -5 -2.5 5 -2.5 z" fill="#b8b8d8" opacity=".7"/>
  <path d="M840 27 l2.5 5 5 2.5 -5 2.5 -2.5 5 -2.5 -5 -5 -2.5 5 -2.5 z" fill="#b8b8d8" opacity=".7"/>
</svg>
