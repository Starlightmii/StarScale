<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="StarScale soundtrack — We Don't Talk Anymore, playing in brand colors">
<defs>
  <radialGradient id="bgG" cx="50%" cy="40%" r="78%">
    <stop offset="0" stop-color="#1c0d0f"/>
    <stop offset=".55" stop-color="#171011"/>
    <stop offset="1" stop-color="#0d0809"/>
  </radialGradient>
  <radialGradient id="vinylG" cx="42%" cy="34%" r="70%">
    <stop offset="0" stop-color="#261718"/>
    <stop offset=".6" stop-color="#12090a"/>
    <stop offset="1" stop-color="#080304"/>
  </radialGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f04452"/>
    <stop offset=".5" stop-color="#ffb03a"/>
    <stop offset="1" stop-color="#ffc46a"/>
  </linearGradient>
  <filter id="labelGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feColorMatrix in="b" type="matrix" values="1 0 0 0 0  0 .35 0 0 0  0 0 .25 0 0  0 0 0 1 0" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation=".6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="cardClip"><rect x="24" y="24" width="592" height="312" rx="16"/></clipPath>
</defs>
<rect width="640" height="360" fill="url(#bgG)"/>
<rect x="24" y="24" width="592" height="312" rx="16" fill="color-mix(in srgb,#1e1415 92%,transparent)" stroke="url(#brand)" stroke-width="1.4" stroke-opacity=".75"/>
<g clip-path="url(#cardClip)">
  <!-- ambient strokes -->
  <g opacity=".8">
    <circle cx="610" cy="10" r="240" fill="#f04452" fill-opacity=".16">
      <animate attributeName="fill-opacity" values=".16;.3;.16" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="370" r="220" fill="#ffb03a" fill-opacity=".12">
      <animate attributeName="fill-opacity" values=".12;.26;.12" dur="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#f8ede6" opacity=".35">
    <circle cx="94" cy="52" r=".9"/>
    <circle cx="570" cy="90" r="1.1" fill="#ffc46a"/>
    <circle cx="522" cy="296" r=".8" fill="#f04452"/>
    <circle cx="110" cy="300" r="1.0" fill="#ffb03a"/>
  </g>
  <!-- vinyl -->
  <g transform="translate(124,180)">
    <circle cx="0" cy="0" r="104" fill="url(#vinylG)" stroke="#382526" stroke-width="1" filter="url(#glassBlur)"/>
    <circle cx="0" cy="0" r="104" fill="none" stroke="url(#brand)" stroke-width=".4" opacity=".65"/>
    <g filter="url(#glassBlur)">
      <path d="M0 -86 A86 86 0 0 1 86 0 L0 0 Z" fill="#f04452" opacity=".18"/>
      <path d="M0 0 A86 86 0 0 1 -86 0 L0 0 Z" fill="#ffb03a" opacity=".14"/>
    </g>
    <!-- grooves -->
    <g opacity=".22" stroke="#f0e2da" stroke-width=".4" fill="none">
      <circle cx="0" cy="0" r="92"/>
      <circle cx="0" cy="0" r="80"/>
      <circle cx="0" cy="0" r="68"/>
      <circle cx="0" cy="0" r="56"/>
    </g>
    <!-- center label -->
    <circle cx="0" cy="0" r="40" fill="#f8ede6" stroke="url(#brand)" stroke-width="2.2" filter="url(#labelGlow)"/>
    <circle cx="0" cy="0" r="24" fill="#ff7a52"/>
    <circle cx="0" cy="0" r="11" fill="#f04452"/>
    <circle cx="0" cy="0" r="4" fill="#f8ede6"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#171011" stroke-width=".8">
      <animate attributeName="r" values="40;41.8;40" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".6;.2;.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <path d="M -2 -40 L 2 -40 L 0 -62 Z" fill="#171011" opacity=".55"/>
    </g>
  </g>
  <!-- arm -->
  <g transform="translate(254,58)" fill="none" stroke="url(#brand)" stroke-width="2">
    <path d="M0,0 L84,100 C92,110 94,132 88,146" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="5" fill="#f8ede6" stroke="url(#brand)"/>
    <circle cx="88" cy="146" r="7" fill="#171011" stroke="url(#brand)" stroke-width="2">
      <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- info -->
  <text x="386" y="104" text-anchor="start" font-family="'Fraunces',serif" font-weight="700" font-size="27" fill="url(#brand)">We Don't Talk Anymore</text>
  <text x="386" y="134" text-anchor="start" font-family="'Cardo',serif" font-size="17" fill="#d3b6ae" font-style="italic">Charlie Puth ft. Selena Gomez</text>
  <text x="386" y="164" text-anchor="start" font-family="monospace" font-size="12" letter-spacing="2" fill="#8a7a72">official · 3:52 · now playing</text>
  <rect x="386" y="188" width="200" height="5" rx="2.5" fill="#1e1415"/>
  <rect x="386" y="188" width="0" height="5" rx="2.5" fill="url(#brand)">
    <animate attributeName="width" values="0;200" dur="232s" fill="freeze"/>
  </rect>
  <circle cx="386" cy="190.5" r="5.5" fill="#f04452">
    <animate attributeName="cx" values="386;586" dur="232s" fill="freeze"/>
  </circle>
  <text x="386" y="210" font-family="monospace" font-size="11" fill="#8a7a72">0:00</text>
  <text x="586" y="210" text-anchor="end" font-family="monospace" font-size="11" fill="#8a7a72">3:52</text>
  <!-- equalizer bars -->
  <g transform="translate(386,292)" filter="url(#glassBlur)">
    <rect x="0" y="-14" width="6" height="14" rx="3" fill="url(#brand)">
      <animate attributeName="height" values="14;28;14" dur=".8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-14;-28;-14" dur=".8s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="-24" width="6" height="24" rx="3" fill="url(#brand)" opacity=".9">
      <animate attributeName="height" values="24;8;24" dur=".73s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-24;-8;-24" dur=".73s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="-36" width="6" height="36" rx="3" fill="url(#brand)" opacity=".9">
      <animate attributeName="height" values="36;16;36" dur="1.06s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-36;-16;-36" dur="1.06s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="-26" width="6" height="26" rx="3" fill="url(#brand)" opacity=".85">
      <animate attributeName="height" values="26;34;26" dur=".91s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-26;-34;-26" dur=".91s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="-16" width="6" height="16" rx="3" fill="url(#brand)" opacity=".85">
      <animate attributeName="height" values="16;24;16" dur=".77s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-16;-24;-16" dur=".77s" repeatCount="indefinite"/>
    </rect>
    <rect x="50" y="-30" width="6" height="30" rx="3" fill="url(#brand)" opacity=".8">
      <animate attributeName="height" values="30;14;30" dur=".65s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-30;-14;-30" dur=".65s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="-20" width="6" height="20" rx="3" fill="url(#brand)" opacity=".8">
      <animate attributeName="height" values="20;38;20" dur=".95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-20;-38;-20" dur=".95s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="472" y="290" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="2.4" fill="#8a7a72">︎︎star radio · soundtrack slot ✦</text>
</g>
<!-- frame glow -->
<rect x="24" y="24" width="592" height="312" rx="16" fill="none" stroke="url(#brand)" stroke-width="1" stroke-dasharray="6 4" opacity=".9">
  <animate attributeName="stroke-dashoffset" values="0;40" dur="4s" repeatCount="indefinite"/>
</rect>
</svg>
