<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="stars on GitHub as a sparkline that keeps rising">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f04452"/><stop offset="1" stop-color="#ffb03a"/>
    </linearGradient>
    <linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb03a" stop-opacity=".28"/><stop offset="1" stop-color="#ffb03a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="880" height="150" fill="#171011"/>
  <text x="30" y="30" font-family="'Courier New',monospace" font-weight="bold" font-size="15" letter-spacing="2" fill="#d8bdb4">★ STARS OVER TIME</text>
  <text x="850" y="30" text-anchor="end" font-family="'Courier New',monospace" font-size="13" fill="#8a7a72">projection: 📈</text>

  <!-- grid dots -->
  <g fill="#382526">
    <circle cx="60" cy="40" r="1.2"/><circle cx="240" cy="40" r="1.2"/><circle cx="420" cy="40" r="1.2"/><circle cx="600" cy="40" r="1.2"/><circle cx="420" cy="40" r="1.2"/>
  </g>

  <!-- polyline rises with a soft glow pulse -->
  <polyline points="40,118 130,102 220,108 310,84 400,92 490,70 580,58 580,110 490,110 400,90 310,102 220,112 130,112 40,124"
            fill="none" stroke="#171011" stroke-width="6" opacity=".8"/>
  <polyline points="40,118 130,102 220,108 310,84 400,92 490,70 580,58" fill="none" stroke="url(#spark)" stroke-width="2.5" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0 800;540 800;540 800" keyTimes="0;.45;1" dur="5s" repeatCount="indefinite"/>
  </polyline>
  <!-- area fill -->
  <path d="M40,118 130,102 220,108 310,84 400,92 490,70 580,58 580,140 40,140 z" fill="url(#spark)" opacity=".18">
    <animate attributeName="opacity" values="0;.28;.18" keyTimes="0;.4;1" dur="5s" repeatCount="indefinite"/>
  </path>
  <!-- head dot -->
  <circle r="4" fill="#fff">
    <animateMotion path="M40,118 L130,102 L220,108 L310,84 L400,92 L490,70 L580,58" dur="5s" keyTimes="0;.45;1" repeatCount="indefinite"/>
  </circle>
  <!-- projection arrow into stars -->
  <path d="M580 58 q80 -14 150 -10" fill="none" stroke="#ffc46a" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <path d="M736 44 l12 5 -12 5 z" fill="#ffc46a"/>
  <text x="700" y="100" font-family="'Courier New',monospace" font-size="13" fill="#ffc46a">your star here ✦</text>
  <text x="760" y="118" font-family="'Courier New',monospace" font-size="11" fill="#8a7a72">(github.com/Starlightmii)</text>

  <!-- axis -->
  <line x1="30" y1="130" x2="850" y2="130" stroke="#382526" stroke-width="1"/>
  <text x="35" y="144" font-family="'Courier New',monospace" font-size="11" fill="#4a3234">launch</text>
  <text x="560" y="144" font-family="'Courier New',monospace" font-size="11" fill="#4a3234">today</text>
  <text x="845" y="144" text-anchor="end" font-family="'Courier New',monospace" font-size="11" fill="#4a3234">soon™</text>

</svg>