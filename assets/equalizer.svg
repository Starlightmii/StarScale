    <rect x="634" y="40" width="14" height="32" rx="3" fill="url(#eq)"><animate attributeName="height" values="32;42;18;34;32" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="40;30;54;38;40" dur="1.2s" repeatCount="indefinite"/></rect>
    <!-- baseline -->
    <rect x="30" y="72" width="630" height="2" fill="url(#eq)" opacity=".5"/>
    <text x="345" y="90" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" letter-spacing="4" fill="#6f695b">▲ NOW UPSCALING · 24/7 · THE STARS NEVER SLEEP ▲</text>
    <!-- counter -->
    <g font-family="'Courier New',monospace" font-size="13">
      <text x="700" y="38" fill="#6f695b">pixels saved:</text>
      <rect x="700" y="46" width="150" height="30" rx="4" fill="#000000" stroke="#3a3a6a" stroke-width="1"/>
      <text x="775" y="67" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="17" fill="#9ad34f">004096</text>
      <text x="858" y="64" text-anchor="end" font-size="11" fill="#6f695b">✦</text>
