    <rect x="172" y="28" width="14" height="44" rx="3" fill="url(#eq)"><animate attributeName="height" values="44;18;36;26;44" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="28;54;36;46;28" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="194" y="40" width="14" height="32" rx="3" fill="url(#eq)"><animate attributeName="height" values="32;42;16;34;32" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="40;30;56;38;40" dur="1.05s" repeatCount="indefinite"/></rect>
