    <rect x="106" y="24" width="14" height="48" rx="3" fill="url(#eq)"><animate attributeName="height" values="48;16;40;30;48" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="24;56;32;42;24" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="128" y="36" width="14" height="36" rx="3" fill="url(#eq)"><animate attributeName="height" values="36;26;42;18;36" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="36;46;30;54;36" dur="1.2s" repeatCount="indefinite"/></rect>
