<svg xmlns="http://www.w3.org/2000/svg" width="880" height="96" viewBox="0 0 880 96" role="img" aria-label="holo equalizer bar and rolling visitor counter">
  <defs>
    <linearGradient id="eq" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9ecf"><animate attributeName="stop-color" values="#ff9ecf;#7de8e0;#9ad34f;#ff9ecf" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset=".5" stop-color="#7de8e0"><animate attributeName="stop-color" values="#7de8e0;#9ad34f;#ff9ecf;#7de8e0" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#9ad34f"><animate attributeName="stop-color" values="#9ad34f;#ff9ecf;#7de8e0;#9ad34f" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>
  <rect width="880" height="96" fill="#0a0a2e"/>

  <!-- equalizer: 28 bars, each bouncing on its own beat -->
