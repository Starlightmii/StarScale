<svg xmlns="http://www.w3.org/2000/svg" width="880" height="54" viewBox="0 0 880 54" role="img" aria-label="scrolling tagline: single file, two engines, zero install, infinite stars">
  <defs>
    <linearGradient id="mtop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f04452"><animate attributeName="stop-color" values="#f04452;#ffb03a;#ffc46a;#f04452" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ffb03a"><animate attributeName="stop-color" values="#ffb03a;#ffc46a;#f04452;#ffb03a" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <clipPath id="mwin"><rect x="8" y="10" width="864" height="34" rx="8"/></clipPath>
  </defs>

  <rect width="880" height="54" fill="#171011"/>
  <rect x="4" y="6" width="872" height="42" rx="10" fill="#1e1415" stroke="url(#mtop)" stroke-width="1.5"/>
  <g clip-path="url(#mwin)">
    <text x="0" y="34" font-family="'Courier New',monospace" font-weight="bold" font-size="19" letter-spacing="3" fill="#ffb03a">
      ✦ SINGLE FILE ✦ TWO ENGINES ✦ ZERO INSTALL ✦ INFINITE STARS ✦ WORKS OFFLINE ✦ AI × GPU ✦ SINGLE FILE ✦ TWO ENGINES ✦ ZERO INSTALL ✦ INFINITE STARS ✦ WORKS OFFLINE ✦ AI × GPU ✦
      <animate attributeName="x" values="0;-1050" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="34" font-family="'Courier New',monospace" font-weight="bold" font-size="19" letter-spacing="3" fill="#f04452" opacity=".35">
      ✦ SINGLE FILE ✦ TWO ENGINES ✦ ZERO INSTALL ✦ INFINITE STARS ✦ WORKS OFFLINE ✦ AI × GPU ✦ SINGLE FILE ✦ TWO ENGINES ✦ ZERO INSTALL ✦ INFINITE STARS ✦ WORKS OFFLINE ✦ AI × GPU ✦
      <animate attributeName="x" values="0;-1050" dur="14s" begin="-7s" repeatCount="indefinite"/>
    </text>
  </g>

</svg>