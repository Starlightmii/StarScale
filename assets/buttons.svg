<svg xmlns="http://www.w3.org/2000/svg" width="470" height="41" viewBox="0 0 470 41" role="img" aria-label="retro 88x31 button wall">
  <rect width="470" height="41" fill="#0a0a2e"/>
  <g font-family="'Courier New',monospace" font-weight="bold" font-size="11">
    <!-- button 1 -->
    <rect x="3" y="5" width="88" height="31" rx="3" fill="#141044" stroke="#ff9ecf" stroke-width="1"/>
    <rect x="3" y="5" width="88" height="12" rx="3" fill="#ff9ecf" opacity=".25"/>
    <text x="47" y="19" text-anchor="middle" fill="#ff9ecf">STARS pillars</text>
    <text x="47" y="31" text-anchor="middle" fill="#b8b8d8">HTML ONLY</text>
    <!-- button 2 -->
    <rect x="97" y="5" width="88" height="31" rx="3" fill="#141044" stroke="#7de8e0" stroke-width="1"/>
    <rect x="97" y="5" width="88" height="12" rx="3" fill="#7de8e0" opacity=".22"/>
    <text x="141" y="19" text-anchor="middle" fill="#7de8e0">★ CLOUD</text>
    <text x="141" y="31" text-anchor="middle" fill="#b8b8d8">NOT FOUND</text>
    <!-- button 3 -->
    <rect x="191" y="5" width="88" height="31" rx="3" fill="#141044" stroke="#9ad34f" stroke-width="1"/>
    <rect x="191" y="5" width="88" height="12" rx="3" fill="#9ad34f" opacity=".22"/>
    <text x="235" y="19" text-anchor="middle" fill="#9ad34f">WEBGL2</text>
    <text x="235" y="31" text-anchor="middle" fill="#b8b8d8">INSIDE</text>
    <!-- button 4 -->
    <rect x="285" y="5" width="88" height="31" rx="3" fill="#141044" stroke="#ff9ecf" stroke-width="1"/>
    <rect x="285" y="5" width="88" height="12" rx="3" fill="#ff9ecf" opacity=".25"/>
    <text x="329" y="19" text-anchor="middle" fill="#ff9ecf">FILE://</text>
    <text x="329" y="31" text-anchor="middle" fill="#b8b8d8">APPROVED ✦</text>
    <!-- button 5 -->
    <rect x="379" y="5" width="88" height="31" rx="3" fill="#141044" stroke="#7de8e0" stroke-width="1">
      <animate attributeName="stroke" values="#7de8e0;#ff9ecf;#9ad34f;#7de8e0" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="423" y="19" text-anchor="middle" fill="#ece4cf">EST. 2026</text>
    <text x="423" y="31" text-anchor="middle" fill="#b8b8d8">✦ ✦ ✦</text>
  </g>
</svg>
