<svg xmlns="http://www.w3.org/2000/svg" width="880" height="130" viewBox="0 0 880 130" role="img" aria-label="award rosette that spins its ribbons and glows">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f04452"><animate attributeName="stop-color" values="#f04452;#ffb03a;#ffc46a;#f04452" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ffb03a"><animate attributeName="stop-color" values="#ffb03a;#ffc46a;#f04452;#ffb03a" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="aglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffc46a" stop-opacity=".4"/><stop offset="1" stop-color="#ffc46a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="880" height="130" fill="#171011"/>

  <!-- award rosette -->
  <g transform="translate(120,62)">
    <circle r="52" fill="url(#aglow)">
      <animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- ribbons -->
    <path d="M-16 38 L-26 74 L-8 62 L-2 80 L10 48 Z" fill="#f04452" opacity=".85"/>
    <path d="M16 38 L26 74 L8 62 L2 80 L-10 48 Z" fill="#ffb03a" opacity=".85">
      <animateTransform attributeName="transform" type="rotate" values="-3;3;-3" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- rosette: scalloped ring via 12 small circles -->
    <g fill="#ffc46a" stroke="#ffb03a" stroke-width="1">
      <circle cx="0" cy="-30" r="7"/><circle cx="15" cy="-26" r="7"/><circle cx="26" cy="-15" r="7"/><circle cx="30" cy="0" r="7"/><circle cx="26" cy="15" r="7"/><circle cx="15" cy="26" r="7"/><circle cx="0" cy="30" r="7"/><circle cx="-15" cy="26" r="7"/><circle cx="-26" cy="15" r="7"/><circle cx="-30" cy="0" r="7"/><circle cx="-26" cy="-15" r="7"/><circle cx="-15" cy="-26" r="7"/>
    </g>
    <circle r="24" fill="#ffc46a" stroke="#ffb03a" stroke-width="1.5"/>
    <text y="7" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="18" fill="#7a5a00">★</text>
  </g>
  <text x="200" y="52" font-family="'Courier New',monospace" font-weight="bold" font-size="17" fill="#f8ede6">🏆 AWARD WINNING PAGE</text>
  <text x="200" y="76" font-family="'Courier New',monospace" font-size="13" fill="#8a7a72">"best single-file upscaler, 1998–2026" — the webring times</text>
  <text x="200" y="96" font-family="'Courier New',monospace" font-size="13" fill="#8a7a72">"crisp beyond mortal rendering" — lanczos3 weekly</text>

  <!-- right side: rotating wisdom badge -->
  <g transform="translate(720,65)">
    <circle r="40" fill="none" stroke="url(#ag)" stroke-width="1.5" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      <circle r="28" fill="none" stroke="#ffc46a" stroke-width="1" stroke-dasharray="3 5"/>
    </g>
    <text y="6" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="13" fill="#ffc46a">✦hot✦</text>
  </g>
  <text x="720" y="120" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#8a7a72">certified: hot</text>

</svg>